<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sign Up | Skill-Build
    </title>


    <!-- =====================================================
         LOAD SAVED THEME BEFORE PAGE RENDERS
         ===================================================== -->

    <script>

        (() => {

            try {

                const savedTheme =
                    localStorage.getItem(
                        "skillBuildTheme"
                    );


                if (
                    savedTheme === "dark" ||
                    savedTheme === "light"
                ) {

                    document.documentElement.setAttribute(
                        "data-theme",
                        savedTheme
                    );

                }

            }

            catch (error) {

                console.warn(
                    "Unable to load saved theme:",
                    error
                );

            }

        })();

    </script>


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body class="auth-body">


    <main class="auth-page">


        <section class="auth-card">


            <!-- =================================================
                 THEME SWITCHER
                 ================================================= -->

            <div class="auth-theme-switcher">

                <div
                    class="theme-switcher"
                    aria-label="Theme selection"
                >

                    <button
                        type="button"
                        class="theme-button"
                        id="lightThemeButton"
                        data-theme="light"
                        aria-label="Switch to light mode"
                        aria-pressed="false"
                        title="Light mode"
                    >
                        ☀
                    </button>


                    <button
                        type="button"
                        class="theme-button"
                        id="darkThemeButton"
                        data-theme="dark"
                        aria-label="Switch to dark mode"
                        aria-pressed="false"
                        title="Dark mode"
                    >
                        🌙
                    </button>

                </div>

            </div>



            <!-- =================================================
                 LOGO
                 ================================================= -->

            <a
                href="/"
                class="auth-logo"
            >
                Skill-Build
            </a>



            <!-- =================================================
                 HEADING
                 ================================================= -->

            <div class="auth-heading">

                <span class="auth-eyebrow">
                    GET STARTED
                </span>


                <h1>
                    Create your account
                </h1>


                <p>
                    Build your skills, track your progress,
                    and keep learning.
                </p>

            </div>



            <!-- =================================================
                 SIGNUP FORM
                 ================================================= -->

            <form
                id="signupForm"
                class="auth-form"
                novalidate
            >


                <!-- =============================================
                     NAME
                     ============================================= -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >


                    <small
                        id="nameError"
                        class="field-error"
                    ></small>

                </div>



                <!-- =============================================
                     EMAIL
                     ============================================= -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >


                    <small
                        id="emailError"
                        class="field-error"
                    ></small>

                </div>



                <!-- =============================================
                     PASSWORD
                     ============================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>



                    <!-- PASSWORD STRENGTH -->

                    <div class="password-strength">

                        <div class="strength-track">

                            <div
                                class="strength-bar"
                                id="strengthBar"
                            ></div>

                        </div>


                        <span
                            id="strengthText"
                            class="password-strength-text"
                        >
                            Password strength
                        </span>

                    </div>



                    <!-- PASSWORD REQUIREMENTS -->

                    <div class="password-requirements">


                        <span id="lengthRequirement">

                            <span class="requirement-icon">
                                ○
                            </span>

                            8+ characters

                        </span>


                        <span id="uppercaseRequirement">

                            <span class="requirement-icon">
                                ○
                            </span>

                            Uppercase letter

                        </span>


                        <span id="numberRequirement">

                            <span class="requirement-icon">
                                ○
                            </span>

                            Number

                        </span>


                        <span id="specialRequirement">

                            <span class="requirement-icon">
                                ○
                            </span>

                            Special character

                        </span>


                    </div>

                </div>



                <!-- =============================================
                     CONFIRM PASSWORD
                     ============================================= -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>


                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>


                    <small
                        id="confirmPasswordMessage"
                        class="field-message"
                    ></small>

                </div>



                <!-- =============================================
                     MESSAGE
                     ============================================= -->

                <p
                    id="signupMessage"
                    class="auth-message"
                    role="alert"
                ></p>



                <!-- =============================================
                     SUBMIT
                     ============================================= -->

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="signupButton"
                >
                    Create Account
                </button>


            </form>



            <!-- =================================================
                 LOGIN LINK
                 ================================================= -->

            <p class="auth-switch">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>



            <!-- =================================================
                 GUEST ACCESS
                 ================================================= -->

            <a
                href="/"
                class="guest-link"
            >
                Continue as Guest
            </a>


        </section>


    </main>



    <!-- =====================================================
         SUPABASE CONFIGURATION
         ===================================================== -->

    <script>

        const SUPABASE_URL =
            "{{ supabase_url }}";


        const SUPABASE_PUBLISHABLE_KEY =
            "{{ supabase_publishable_key }}";

    </script>



    <!-- =====================================================
         SUPABASE CLIENT
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =====================================================
         SIGNUP LOGIC
         ===================================================== -->

<script
    src="{{ url_for(
        'static',
        filename='js/signup.js'
    ) }}"
></script>

<script
    src="{{ url_for(
        'static',
        filename='js/theme.js'
    ) }}"
></script>

</body>

</html>
