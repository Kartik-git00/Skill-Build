<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Skill-Build
    </title>


    <!-- =====================================================
         LOAD SAVED THEME BEFORE PAGE RENDERS
         ===================================================== -->

    <script>

        (() => {

            try {

                const savedTheme =
                    localStorage.getItem(
                        "skillBuildTheme"
                    );


                if (
                    savedTheme === "dark" ||
                    savedTheme === "light"
                ) {

                    document.documentElement.setAttribute(
                        "data-theme",
                        savedTheme
                    );

                }

            }

            catch (error) {

                console.warn(
                    "Unable to load saved theme:",
                    error
                );

            }

        })();

    </script>


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body class="auth-body">


    <main class="auth-page">


        <section class="auth-card">


            <!-- =================================================
                 THEME SWITCHER
                 ================================================= -->

            <div class="auth-theme-switcher">

                <div
                    class="theme-switcher"
                    aria-label="Theme selection"
                >


                    <button
                        type="button"
                        class="theme-button"
                        id="lightThemeButton"
                        data-theme="light"
                        aria-label="Switch to light mode"
                        aria-pressed="false"
                        title="Light mode"
                    >
                        ☀
                    </button>


                    <button
                        type="button"
                        class="theme-button"
                        id="darkThemeButton"
                        data-theme="dark"
                        aria-label="Switch to dark mode"
                        aria-pressed="false"
                        title="Dark mode"
                    >
                        🌙
                    </button>


                </div>

            </div>



            <!-- =================================================
                 LOGO
                 ================================================= -->

            <a
                href="/"
                class="auth-logo"
            >
                Skill-Build
            </a>



            <!-- =================================================
                 HEADING
                 ================================================= -->

            <div class="auth-heading">

                <span class="auth-eyebrow">
                    WELCOME BACK
                </span>


                <h1>
                    Welcome back
                </h1>


                <p>
                    Login to continue your learning journey.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                id="loginForm"
                class="auth-form"
                novalidate
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="form-label-row">

                        <label for="password">
                            Password
                        </label>


                        <a
                            href="#"
                            class="forgot-link"
                            id="forgotPasswordLink"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>



                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="auth-message"
                    role="alert"
                ></p>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="loginButton"
                >
                    Login
                </button>


            </form>



            <!-- =================================================
                 SIGN UP
                 ================================================= -->

            <div class="auth-divider">

                <span>
                    New to Skill-Build?
                </span>

            </div>


            <a
                href="/signup"
                class="btn btn-outline auth-secondary-button"
            >
                Create an account
            </a>



            <!-- =================================================
                 GUEST
                 ================================================= -->

            <a
                href="/"
                class="guest-link"
            >
                Continue as Guest
            </a>


        </section>


    </main>



    <!-- =====================================================
         SUPABASE CONFIGURATION
         ===================================================== -->

    <script>

        const SUPABASE_URL =
            "{{ supabase_url }}";


        const SUPABASE_PUBLISHABLE_KEY =
            "{{ supabase_publishable_key }}";

    </script>



    <!-- =====================================================
         SUPABASE CLIENT
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =====================================================
         LOGIN LOGIC
         ===================================================== -->

<script
    src="{{ url_for('static', filename='js/login.js') }}"
></script>

<script
    src="{{ url_for('static', filename='js/theme.js') }}"
></script>

</body>


</body>

</html>
